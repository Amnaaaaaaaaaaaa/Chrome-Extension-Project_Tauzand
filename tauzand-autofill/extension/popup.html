<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font-family: system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #1F4E79;
    }
    label {
      font-size: 12px;
      color: #555;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #1F4E79;
      color: white;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary {
      background: #EAF1F8;
      color: #1F4E79;
    }
    #status {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>Tauzand Autofill</h1>

  <label for="profileId">Your Profile ID</label>
  <input type="text" id="profileId" placeholder="e.g. 3f9a2b1c-..." />
  <button id="saveBtn" class="secondary">Save</button>

  <button id="fillBtn">Fill This Form Now</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
